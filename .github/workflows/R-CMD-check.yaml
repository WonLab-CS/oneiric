on:
  push:
    branches: [main]
name: R CMD Check
permissions: read-all
jobs:
  check-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libbz2-dev liblzma-dev zlib1g-dev libglpk-dev pandoc texlive-latex-base
      - name: Install remotes and BiocManager
        run: |
          install.packages("remotes")
          install.packages("BiocManager")
        shell: Rscript {0}
      - name: Install Bioconductor packages
        run: |
          BiocManager::install(c(
            "S4Vectors",
            "Rhtslib",
            "Rsamtools",
            "IRanges",
            "GenomicRanges",
            "GenomeInfoDb",
            "edgeR",
            "DESeq2",
            "splatter",
            "SingleCellExperiment",
            "SummarizedExperiment"
          ))
        shell: Rscript {0}
      - name: Install Signac
        run: |
          install.packages("Signac", repos = "https://cloud.r-project.org")
        shell: Rscript {0}
      - name: Install package dependencies
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}
      - name: Install rcmdcheck
        run: |
          install.packages("rcmdcheck")
        shell: Rscript {0}
      - name: Run Checks
        uses: r-lib/actions/check-r-package@v2