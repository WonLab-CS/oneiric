on:
  push:
    branches: [main]
name: R CMD Check
permissions: read-all
jobs:
  check-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install BiocManager
        run: |
          install.packages("BiocManager")
        shell: Rscript {0}
      - name: Install Bioconductor dependencies
        run: |
          BiocManager::install(c("BiocGenerics", "S4Vectors", "Rsamtools", "IRanges", 
                                  "GenomicRanges", "GenomeInfoDb", "edgeR", "DESeq2",
                                  "SummarizedExperiment", "SingleCellExperiment"), 
                               ask = FALSE)
        shell: Rscript {0}
      - name: Install remotes
        run: |
          install.packages("remotes")
        shell: Rscript {0}
      - name: Install GitHub Dependencies
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}
      - name: Install Additional Packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
      - name: Run Checks
        uses: r-lib/actions/check-r-package@v2